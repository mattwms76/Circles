name: Circles CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  # Public build settings only. No database, OAuth signing, storage, or Expo secrets.
  EXPO_PUBLIC_API_BASE_URL: ${{ vars.EXPO_PUBLIC_API_BASE_URL || 'http://localhost:3000' }}
  EXPO_PUBLIC_APP_ID: ${{ vars.EXPO_PUBLIC_APP_ID || 'circles-ci' }}
  EXPO_PUBLIC_OAUTH_PORTAL_URL: ${{ vars.EXPO_PUBLIC_OAUTH_PORTAL_URL || 'https://oauth.example.invalid' }}
  EXPO_PUBLIC_OAUTH_SERVER_URL: ${{ vars.EXPO_PUBLIC_OAUTH_SERVER_URL || 'https://oauth-api.example.invalid' }}
  EXPO_NO_TELEMETRY: "1"

jobs:
  checks:
    name: Environment, TypeScript, tests, and API build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install the package-manager version declared in package.json
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          run_install: false
          cache: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22.23.4"
          package-manager-cache: false
          # Untrusted PRs never restore or write the trusted push-job dependency cache.
          cache: ${{ github.event_name != 'pull_request' && 'pnpm' || '' }}
          cache-dependency-path: pnpm-lock.yaml

      - name: Install and verify continuity encryption tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends age tar
          command -v age
          command -v tar
          age --version
          tar --version

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Check environment template and safe CI configuration
        run: |
          pnpm check:env --template
          pnpm check:env --mode ci

      - name: TypeScript check
        run: pnpm check

      - name: ESLint zero-error and zero-warning check
        run: pnpm lint:ci --max-warnings=0

      - name: Run unit and regression tests
        run: |
          mkdir -p artifacts/test-results
          pnpm test:ci

      - name: Install isolated Circle Home PostgreSQL 17 test tools
        run: |
          if ! test -x /usr/lib/postgresql/17/bin/initdb; then
            expected_pgdg_primary_fingerprint='B97B0AFCAA1A47F044F244A07FCC7D46ACCC4CF8'
            key_file="$(mktemp)"
            gnupg_home="$(mktemp -d)"
            cleanup_pgdg_key() {
              rm -f "$key_file"
              rm -rf "$gnupg_home"
            }
            trap cleanup_pgdg_key EXIT
            curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
              https://www.postgresql.org/media/keys/ACCC4CF8.asc \
              --output "$key_file"
            actual_pgdg_primary_fingerprint="$(
              gpg --batch --homedir "$gnupg_home" --show-keys --with-colons "$key_file" \
                | awk -F: '$1 == "pub" { primary = 1; next } primary && $1 == "fpr" { print $10; exit }'
            )"
            test "$actual_pgdg_primary_fingerprint" = "$expected_pgdg_primary_fingerprint"
            sudo install -d /usr/share/postgresql-common/pgdg
            sudo install --mode=0644 "$key_file" /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
            printf '%s\n' \
              'Types: deb' \
              'URIs: https://apt.postgresql.org/pub/repos/apt' \
              'Suites: noble-pgdg' \
              "Architectures: $(dpkg --print-architecture)" \
              'Components: main' \
              'Signed-By: /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc' \
              | sudo tee /etc/apt/sources.list.d/circles-pgdg.sources > /dev/null
            sudo apt-get update
          fi
          sudo apt-get install --yes --no-install-recommends postgresql-17 python3-psycopg
          /usr/lib/postgresql/17/bin/initdb --version
          /usr/bin/python3 -c 'import psycopg'

      - name: Run isolated Circle Home HTTP and PostgreSQL E2E
        run: pnpm test:e2e:circle-home

      - name: Run isolated Activity Inbox HTTP and PostgreSQL E2E
        run: pnpm test:e2e:activity

      - name: Run isolated Moderator Workspace HTTP and PostgreSQL E2E
        run: pnpm test:e2e:moderation

      - name: Run isolated A26 conversation authority and pagination HTTP E2E
        run: /usr/bin/python3 -B scripts/run-circle-home-e2e.py --suite a26-authority

      - name: Run isolated security media-release and atomic-transport PostgreSQL E2E
        run: /usr/bin/python3 -B scripts/run-circle-home-e2e.py --suite sec27-security

      - name: Run isolated retry-safe publication HTTP and PostgreSQL E2E
        run: pnpm test:e2e:post-publish

      - name: Run isolated email identity roles and allocation-race drills
        env:
          CIRCLES_EMAIL_AUTH_LOCAL_PG17: "1"
          POSTGRES17_BIN: /usr/lib/postgresql/17/bin
        run: |
          node tests/email-identity.pg-test.mjs
          node --import tsx scripts/run-email-identity-e2e.mjs

      - name: Run isolated email HTTP and durable-session PostgreSQL drill
        env:
          CIRCLES_EMAIL_AUTH_LOCAL_PG17: "1"
          POSTGRES17_BIN: /usr/lib/postgresql/17/bin
        run: node --import tsx scripts/run-email-auth-http-e2e.mjs

      - name: Compile API
        run: pnpm build

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: circles-test-results-${{ github.sha }}
          path: artifacts/test-results/junit.xml
          if-no-files-found: warn
          retention-days: 14
          include-hidden-files: false

      - name: Upload compiled API
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: circles-api-${{ github.sha }}
          path: dist/index.js
          if-no-files-found: error
          retention-days: 14
          include-hidden-files: false

  bundles:
    name: Compile ${{ matrix.platform }} app bundle
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        platform: [web, ios, android]
    steps:
      - name: Checkout source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install the package-manager version declared in package.json
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          run_install: false
          cache: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22.23.4"
          package-manager-cache: false
          cache: ${{ github.event_name != 'pull_request' && 'pnpm' || '' }}
          cache-dependency-path: pnpm-lock.yaml

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Compile Expo app bundle
        run: >-
          pnpm exec expo export
          --platform ${{ matrix.platform }}
          --output-dir artifacts/bundles/${{ matrix.platform }}
          --max-workers 1

      - name: Upload compiled app bundle
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: circles-${{ matrix.platform }}-bundle-${{ github.sha }}
          path: artifacts/bundles/${{ matrix.platform }}/
          if-no-files-found: error
          retention-days: 14
          include-hidden-files: false
